<style>
/* ── Yellow Pastel Theme ── */
:root{
  --y1:#FFFBEB;--y2:#FEF3C7;--y3:#FDE68A;--y4:#F59E0B;--y5:#D97706;
  --y6:#92400E;--yw:#FFFDF5;
  --text-main:#3B2A00;--text-mid:#78500A;--text-soft:#A67C3A;
  --border-light:#FDE68A;--border-mid:#F59E0B;
  --shadow:0 2px 8px rgba(245,158,11,0.15);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:var(--y1);min-height:100vh}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem;background:linear-gradient(135deg,var(--y1),var(--y2))}
.login-card{background:var(--yw);border:1.5px solid var(--border-light);border-radius:16px;padding:2.5rem;width:100%;max-width:400px;box-shadow:var(--shadow)}
.logo-area{text-align:center;margin-bottom:2rem}
.logo-area h1{font-size:20px;font-weight:600;color:var(--text-main);margin-top:8px}
.logo-area p{font-size:13px;color:var(--text-soft);margin-top:4px}
.logo-icon{width:56px;height:56px;background:var(--y2);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto;border:2px solid var(--y3)}
.field{margin-bottom:1rem}
.field label{display:block;font-size:13px;color:var(--text-mid);margin-bottom:6px;font-weight:500}
.field input{width:100%;padding:8px 12px;border:1.5px solid var(--border-light);border-radius:8px;font-size:14px;background:var(--yw);color:var(--text-main);font-family:'Sarabun',sans-serif;transition:border-color .2s}
.field input:focus{outline:none;border-color:var(--y4)}
.btn-primary{width:100%;padding:10px;background:var(--y4);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Sarabun',sans-serif;transition:background .2s}
.btn-primary:hover{background:var(--y5)}.btn-primary:disabled{background:var(--y3);cursor:not-allowed;color:var(--y5)}
.err{color:#B91C1C;font-size:13px;margin-top:8px;text-align:center}

/* HEADER */
.header{background:var(--y2);border-bottom:1.5px solid var(--y3);padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:56px}
.header-title{font-size:15px;font-weight:600;color:var(--text-main)}

/* TABS */
.nav-tabs{display:flex;gap:4px;padding:0 1.5rem;background:var(--yw);border-bottom:1.5px solid var(--border-light)}
.tab{padding:12px 16px;font-size:14px;border:none;background:none;cursor:pointer;color:var(--text-soft);border-bottom:2.5px solid transparent;font-family:'Sarabun',sans-serif;transition:all .2s}
.tab.active{color:var(--y5);border-bottom-color:var(--y4);font-weight:600}
.tab:hover:not(.active){color:var(--text-mid)}

/* CONTENT */
.content{padding:1.5rem;max-width:1200px;margin:0 auto}
.card{background:var(--yw);border:1.5px solid var(--border-light);border-radius:12px;padding:1.25rem;box-shadow:var(--shadow)}

/* BUTTONS */
.btn-sm{padding:6px 12px;border:1.5px solid var(--border-light);border-radius:7px;font-size:13px;cursor:pointer;background:var(--yw);color:var(--text-main);font-family:'Sarabun',sans-serif;white-space:nowrap;transition:all .2s}
.btn-sm:hover{background:var(--y2);border-color:var(--y4)}.btn-sm:disabled{opacity:0.5;cursor:not-allowed}
.btn-green{background:var(--y4);color:#fff;border-color:var(--y4)}.btn-green:hover{background:var(--y5);border-color:var(--y5)}
.btn-danger{color:#B91C1C;border-color:#FECACA}.btn-danger:hover{background:#FEF2F2}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:8px 10px;color:var(--text-soft);font-weight:600;border-bottom:1.5px solid var(--border-light);font-size:12px;background:var(--y1)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--y2);color:var(--text-main)}
.tbl tr:last-child td{border-bottom:none}.tbl tr:hover td{background:var(--y1)}

/* SEARCH ROW */
.search-row{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.search-row input{padding:8px 10px;border:1.5px solid var(--border-light);border-radius:8px;font-size:13px;background:var(--yw);color:var(--text-main);font-family:'Sarabun',sans-serif;flex:1;min-width:150px;transition:border-color .2s}
.search-row input:focus{outline:none;border-color:var(--y4)}

/* MODAL */
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(120,80,10,0.35);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--yw);border-radius:14px;padding:1.5rem;width:92%;max-width:680px;max-height:90vh;overflow-y:auto;border:1.5px solid var(--border-light);box-shadow:0 8px 32px rgba(245,158,11,0.2)}
.modal h3{font-size:16px;font-weight:600;margin-bottom:1rem;color:var(--text-main)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-field{display:flex;flex-direction:column;gap:4px}
.form-field label{font-size:12px;color:var(--text-soft);font-weight:500}
.form-field input,.form-field select{padding:7px 10px;border:1.5px solid var(--border-light);border-radius:7px;font-size:13px;background:var(--yw);color:var(--text-main);font-family:'Sarabun',sans-serif;transition:border-color .2s}
.form-field input:focus,.form-field select:focus{outline:none;border-color:var(--y4)}
.form-field input[readonly]{background:var(--y1);color:var(--text-soft);cursor:default}
.form-field.full{grid-column:1/-1}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem;flex-wrap:wrap}

/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:1.5rem}
.stat{background:var(--y2);border-radius:10px;padding:1rem;border:1.5px solid var(--y3)}
.stat .val{font-size:22px;font-weight:600;color:var(--text-main)}.stat .lbl{font-size:12px;color:var(--text-soft);margin-bottom:4px}
.section-title{font-size:13px;font-weight:600;color:var(--text-soft);margin-bottom:8px;margin-top:4px}

/* AUTOCOMPLETE */
.ac-wrap{position:relative;flex:2}
.ac-list{position:absolute;top:100%;left:0;right:0;background:var(--yw);border:1.5px solid var(--y3);border-radius:8px;z-index:200;max-height:180px;overflow-y:auto;box-shadow:0 4px 16px rgba(245,158,11,0.2)}
.ac-item{padding:8px 10px;cursor:pointer;font-size:13px;color:var(--text-main)}.ac-item:hover{background:var(--y2)}

/* MISC */
.loading{display:flex;align-items:center;gap:8px;color:var(--text-soft);font-size:13px;padding:2rem;justify-content:center}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:999}
.print-type-modal{background:var(--yw);border-radius:14px;padding:1.5rem;width:92%;max-width:420px;border:1.5px solid var(--border-light)}
.print-type-modal h3{font-size:16px;font-weight:600;margin-bottom:1rem;color:var(--text-main)}
.print-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.25rem}
.print-opt{border:1.5px solid var(--border-light);border-radius:10px;padding:14px 10px;cursor:pointer;text-align:center;background:var(--yw);transition:all .2s}
.print-opt:hover{border-color:var(--y4);background:var(--y2)}
.print-opt.selected{border-color:var(--y5);background:var(--y2)}
.print-opt .opt-icon{font-size:22px;margin-bottom:6px}.print-opt .opt-label{font-size:13px;font-weight:600;color:var(--text-main)}.print-opt .opt-sub{font-size:11px;color:var(--text-soft);margin-top:2px}
.confirm-bar{background:#FFFBEB;border:1.5px solid var(--y3);border-radius:8px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.confirm-bar span{font-size:13px;color:var(--text-mid)}
/* date toggle */
.date-toggle{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.date-toggle input[type=checkbox]{width:16px;height:16px;accent-color:var(--y4);cursor:pointer}
.date-toggle label{font-size:12px;color:var(--text-soft);font-weight:500;cursor:pointer}
/* SETS */
.sets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:1rem}
.set-card{background:var(--yw);border:1.5px solid var(--y3);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .2s}
.set-card:hover{box-shadow:0 4px 16px rgba(245,158,11,0.25)}
.set-card-header{background:var(--y2);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1.5px solid var(--y3)}
.set-card-title{font-size:14px;font-weight:600;color:var(--text-main)}
.set-card-price{font-size:13px;font-weight:700;color:var(--y5);background:var(--yw);padding:3px 10px;border-radius:20px;border:1px solid var(--y3)}
.set-card-body{padding:12px 14px}
.set-item-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--y2);font-size:13px}
.set-item-row:last-child{border-bottom:none}
.set-item-name{color:var(--text-main);flex:1}
.set-item-qty{color:var(--text-soft);font-size:12px;margin-left:8px}
.set-card-footer{padding:10px 14px;display:flex;gap:8px;border-top:1px solid var(--y2)}
.modal-wide{max-width:820px}
.set-builder{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.set-builder-col-title{font-size:12px;font-weight:600;color:var(--text-soft);margin-bottom:6px}
.set-product-list{border:1.5px solid var(--y3);border-radius:8px;overflow:hidden;max-height:360px;overflow-y:auto}
.set-prod-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;font-size:13px;border-bottom:1px solid var(--y2);cursor:pointer;transition:background .15s}
.set-prod-item:hover{background:var(--y2)}
.set-prod-item:last-child{border-bottom:none}
.set-prod-name{flex:1;color:var(--text-main)}
.set-prod-price{color:var(--text-soft);font-size:12px;margin:0 8px}
.set-selected{border:1.5px solid var(--y3);border-radius:8px;overflow:hidden;max-height:360px;overflow-y:auto}
.set-sel-item{display:grid;grid-template-columns:1fr 60px 28px;gap:6px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--y2);font-size:13px}
.set-sel-item:last-child{border-bottom:none}
.set-sel-name{color:var(--text-main);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.set-sel-qty{padding:4px 6px;border:1.5px solid var(--y3);border-radius:5px;font-size:12px;width:100%;font-family:'Sarabun',sans-serif;background:var(--yw);color:var(--text-main);text-align:center}
.set-search{width:100%;padding:7px 10px;border:1.5px solid var(--border-light);border-radius:7px;font-size:13px;background:var(--yw);color:var(--text-main);font-family:'Sarabun',sans-serif;margin-bottom:8px}
.set-search:focus{outline:none;border-color:var(--y4)}
</style>

function numFmt(n){return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});}
function thaiDate(){const m=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];const n=new Date();return n.getDate()+' '+m[n.getMonth()]+' '+(n.getFullYear()+543);}

async function sbPatch(table,match,body){const r=await fetch(`${SB_URL}/rest/v1/${table}?${match}`,{method:'PATCH',headers:{...SB_H,'Prefer':'return=minimal'},body:JSON.stringify(body)});return r;}

function bahtText(amount){
  const ones=['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'];
  const places=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  function rb(n){const d=String(Math.floor(n)).split('').map(Number);const L=d.length;let s='';
    for(let i=0;i<L;i++){const v=d[i];const p=L-1-i;if(!v)continue;
      if(p===1&&v===1)s+='สิบ';else if(p===0&&v===1&&L>1)s+='เอ็ด';else s+=ones[v]+places[p];}return s;}
  if(!amount)return'ศูนย์บาทถ้วน';
  const tot=Math.round(amount*100);const baht=Math.floor(tot/100);const st=tot%100;
  let r='';if(baht>=1000000)r+=rb(Math.floor(baht/1000000))+'ล้าน';
  const rem=baht%1000000;if(rem>0)r+=rb(rem);
  r+='บาท';if(st>0)r+=rb(st)+'สตางค์';else r+='ถ้วน';
  return r||'ศูนย์บาทถ้วน';
}

function fmtTs(ts){
  if(!ts)return'';const s=String(ts);
  if(s.includes('T')){try{const d=new Date(s);const m=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    return d.getDate()+' '+m[d.getMonth()]+' '+(d.getFullYear()+543);}catch(e){}}
  return s;
}

function setModalHtml(){
  const m=state.setModal;
  const s=m.set;
  const q=state.setProductSearch.toLowerCase();

  // keys
  const allKeys=state.products.length>0?Object.keys(state.products[0]):[];
  const groupKey=allKeys.find(k=>k.includes('กลุ่ม'))||allKeys[0]||'';
  const subKey=allKeys.find(k=>k.includes('หมวด')||k.includes('ย่อย'))||allKeys[1]||'';
  const nameKey=allKeys.find(k=>k.includes('ยี่ห้อ'))||allKeys.find(k=>k.includes('name'))||allKeys[2]||'';
  const priceKey=allKeys.find(k=>k.includes('ราคา'))||allKeys.find(k=>k.includes('price'))||'';
  const unitKey=allKeys.find(k=>k.includes('หน่วย'))||allKeys.find(k=>k.includes('unit'))||'';

  // กรองและเรียงตามกลุ่ม → หมวดย่อย → ชื่อ
  const filtered=state.products
    .filter(p=>!q||JSON.stringify(Object.values(p)).toLowerCase().includes(q))
    .slice().sort((a,b)=>{
      const g=(a[groupKey]||'').localeCompare(b[groupKey]||'','th');
      if(g!==0)return g;
      const sb=(a[subKey]||'').localeCompare(b[subKey]||'','th');
      if(sb!==0)return sb;
      return(a[nameKey]||'').localeCompare(b[nameKey]||'','th');
    });

  // จัดกลุ่มสำหรับแสดง
  const groups=[];
  let lastGroup='',lastSub='';
  filtered.forEach(p=>{
    const g=p[groupKey]||'';
    const sb=p[subKey]||'';
    if(g!==lastGroup){groups.push({type:'group',label:g});lastGroup=g;lastSub='';}
    if(sb&&sb!==lastSub){groups.push({type:'sub',label:sb});lastSub=sb;}
    groups.push({type:'item',p});
  });

  const totalCalc=(s.items||[]).reduce((sum,i)=>sum+(Number(i.qty)*Number(i.price)),0);

  // ฝั่งซ้าย: รายการยา (แบ่งกลุ่ม, ไม่ scroll กลับบน)
  const leftHtml=groups.length===0
    ?`<div style="padding:1rem;text-align:center;color:var(--text-soft);font-size:13px">ไม่พบสินค้า</div>`
    :groups.map(entry=>{
      if(entry.type==='group') return `<div style="padding:6px 12px 3px;font-size:11px;font-weight:700;color:var(--y5);background:var(--y1);position:sticky;top:0;z-index:1;border-bottom:1px solid var(--y2)">${entry.label}</div>`;
      if(entry.type==='sub')   return `<div style="padding:3px 12px;font-size:11px;color:var(--text-soft);background:var(--yw)">${entry.label}</div>`;
      const p=entry.p;
      const pname=p[nameKey]||'';
      const pprice=Number(p[priceKey]||0);
      const punit=p[unitKey]||'';
      const alreadyIn=(s.items||[]).some(i=>i.product===pname&&i.unit===punit);
      const enc=encodeURIComponent(JSON.stringify({product:pname,unit:punit,price:pprice,qty:1}));
      return `<div class="set-prod-item" data-addprod="${enc}" style="${alreadyIn?'opacity:.55;':''}">
        <span class="set-prod-name">${pname}${punit?` <span style="color:var(--text-soft);font-size:11px">(${punit})</span>`:''}</span>
        <span class="set-prod-price">${pprice.toLocaleString()} ฿</span>
        <span style="font-size:15px;color:${alreadyIn?'var(--y4)':'var(--text-soft)'}">${alreadyIn?'✓':'＋'}</span>
      </div>`;
    }).join('');

  // ฝั่งขวา: รายการในเซ็ต พร้อมราคา/หน่วย และราคารวมแต่ละชิ้น
  const rightHtml=!(s.items||[]).length
    ?`<div style="padding:1.5rem;text-align:center;color:var(--text-soft);font-size:13px">ยังไม่มีสินค้าในเซ็ต<br>คลิกรายการทางซ้ายเพื่อเพิ่ม</div>`
    :`<div style="display:grid;grid-template-columns:1fr 48px 48px 56px 26px;gap:4px;padding:5px 10px;font-size:11px;color:var(--text-soft);font-weight:600;background:var(--y1);border-bottom:1px solid var(--y2)">
        <span>สินค้า</span><span style="text-align:center">จำนวน</span><span style="text-align:right">ราคา/ชิ้น</span><span style="text-align:right">รวม</span><span></span>
      </div>`
    +(s.items||[]).map((it,idx)=>{
      const rowTotal=Number(it.qty)*Number(it.price);
      return`<div style="display:grid;grid-template-columns:1fr 48px 48px 56px 26px;gap:4px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--y2);font-size:12px">
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-main)" title="${it.product}">${it.product}${it.unit?` <span style="color:var(--text-soft);font-size:10px">(${it.unit})</span>`:''}</span>
        <input class="set-sel-qty" type="number" min="1" value="${it.qty}" data-setqty="${idx}" style="text-align:center">
        <span style="text-align:right;color:var(--text-soft)">${Number(it.price).toLocaleString()}</span>
        <span style="text-align:right;font-weight:600;color:var(--y5)">${numFmt(rowTotal)}</span>
        <button class="btn-sm btn-danger" data-removesetitem="${idx}" style="padding:2px 5px;font-size:11px">🗑</button>
      </div>`;
    }).join('');

  return `<div class="modal-bg" id="setModalBg"><div class="modal modal-wide">
    <h3>${m.mode==='new'?'＋ สร้างเซ็ตสินค้าใหม่':'✏️ แก้ไขเซ็ต'}</h3>
    <div class="form-grid" style="margin-bottom:1rem">
      <div class="form-field"><label>ชื่อเซ็ต <span style="color:#B91C1C">*</span></label>
        <input id="set_name" value="${(s.name||'').replace(/"/g,'&quot;')}" placeholder="เช่น เซ็ตยา 1,000 บาท"></div>
      <div class="form-field"><label>ราคารวมเซ็ต (บาท) — คำนวณอัตโนมัติ</label>
        <input id="set_price" type="number" value="${totalCalc}" readonly style="background:var(--y1);font-weight:600;color:var(--y5)"></div>
      <div class="form-field full"><label>คำอธิบาย</label>
        <input id="set_desc" value="${(s.description||'').replace(/"/g,'&quot;')}" placeholder="เช่น เซ็ตยาพื้นฐานสำหรับหน่วยงาน"></div>
    </div>
    <div class="set-builder">
      <div>
        <div class="set-builder-col-title">รายการยาทั้งหมด (คลิกเพื่อเพิ่ม)</div>
        <input class="set-search" id="setProductSearch" placeholder="🔍 ค้นหายา..." value="${state.setProductSearch}" autocomplete="off">
        <div class="set-product-list" id="prodListScroll">${leftHtml}</div>
      </div>
      <div>
        <div class="set-builder-col-title">รายการในเซ็ต (${(s.items||[]).length} รายการ — รวม <strong style="color:var(--y5)">${numFmt(totalCalc)}</strong> บาท)</div>
        <div class="set-selected">${rightHtml}</div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-sm" id="cancelSetModal">ยกเลิก</button>
      <button class="btn-sm btn-green" id="saveSetModal" ${state.saving?'disabled':''}>
        ${state.saving?'กำลังบันทึก...':'💾 บันทึกเซ็ต'}
      </button>
    </div>
  </div></div>`;
}

function setupAC(iId,uId,pId){
  const inp=document.getElementById(iId);if(!inp||!state.products.length)return;
  let ac=null;
  function close(){if(ac){ac.remove();ac=null;}}
  inp.addEventListener('input',function(){
    close();const q=this.value.toLowerCase();if(!q)return;
    const m=state.products.filter(p=>JSON.stringify(Object.values(p)).toLowerCase().includes(q)).slice(0,8);
    if(!m.length)return;
    ac=document.createElement('div');ac.className='ac-list';
    m.forEach(p=>{
      const keys=Object.keys(p);const it=document.createElement('div');it.className='ac-item';
      it.textContent=Object.values(p).filter(Boolean).join(' — ');
      it.onclick=()=>{
        const bk=keys.find(k=>k.includes('ยี่ห้อ'));const nk=keys.find(k=>k.includes('ตัวยา'));
        const uk=keys.find(k=>k.includes('หน่วย'));const pk=keys.find(k=>k.includes('ราคา'));
        inp.value=[p[bk],p[nk]].filter(Boolean).join(' ');
        if(uk&&uId)document.getElementById(uId).value=p[uk]||'';
        if(pk&&pId)document.getElementById(pId).value=p[pk]||'';
        close();markDirty();
      };
      ac.appendChild(it);
    });
    const w=inp.closest('.ac-wrap');if(w){w.style.position='relative';w.appendChild(ac);}
  });
  inp.addEventListener('change',markDirty);
  document.addEventListener('click',e=>{if(ac&&!ac.contains(e.target)&&e.target!==inp)close();});
}
function setupAllAC(pfx,n){for(let i=0;i<n;i++)setupAC(`${pfx}name_${i}`,`${pfx}unit_${i}`,`${pfx}price_${i}`);}
function markDirty(){if(state.editModal&&!state.editDirty){state.editDirty=true;render();setupAllAC('e_',state.editModal.items.length);}}

function getItems(pfx,max){
  const items=[];
  for(let i=0;i<max;i++){
    const n=document.getElementById(pfx+'name_'+i);if(!n)continue;
    const name=n.value||'';const unit=document.getElementById(pfx+'unit_'+i)?.value||'';
    const qty=Number(document.getElementById(pfx+'qty_'+i)?.value)||0;
    const price=Number(document.getElementById(pfx+'price_'+i)?.value)||0;
    if(name)items.push({product:name,unit,qty,price});
  }
  return items;
}
function getCustFromDom(prefix,useDate){
  return{
    customerName:document.getElementById(prefix+'cname')?.value||'',
    customerAddr:document.getElementById(prefix+'addr')?.value||'',
    customerTax:document.getElementById(prefix+'tax')?.value||'',
    customerPhone:document.getElementById(prefix+'phone')?.value||'',
    timestamp:useDate?(document.getElementById(prefix+'date')?.value||''):'',
  };
}

async function doSave(ref,agency,items,action,custData){
  if(action==='saveOrder'){
    await sbPost('orders',{
      ref,agency,
      timestamp:custData.timestamp||null,
      customer_name:custData.customerName||'',
      customer_addr:custData.customerAddr||'',
      customer_phone:custData.customerPhone||'',
      customer_tax:custData.customerTax||''
    });
  } else {
    // updateOrder: อัปเดต customer fields ด้วย
    await sbPatch('orders',`ref=eq.${encodeURIComponent(ref)}`,{
      timestamp:custData.timestamp||null,
      customer_name:custData.customerName||'',
      customer_addr:custData.customerAddr||'',
      customer_phone:custData.customerPhone||'',
      customer_tax:custData.customerTax||''
    });
  }
  await sbDelete('order_items',`order_ref=eq.${encodeURIComponent(ref)}`);
  if(items.length>0){
    await sbPost('order_items',items.map(i=>({order_ref:ref,product:i.product,unit:i.unit,qty:i.qty,price:i.price})));
  }
  return {success:true};
}

async function loadOrders(){
  state.ordersLoading=true;render();
  try{
    const orders=await sbGet('orders','select=*&order=created_at.desc');
    const items=await sbGet('order_items','select=*');
    if(!Array.isArray(orders))throw new Error('bad response');
    state.orders=orders.map(o=>({
      ref:o.ref,agency:o.agency,
      timestamp:fmtTs(o.timestamp||o.created_at||''),
      customerName:o.customer_name||'',
      customerAddr:o.customer_addr||'',
      customerPhone:o.customer_phone||'',
      customerTax:o.customer_tax||'',
      items:(items||[]).filter(i=>i.order_ref===o.ref).map(i=>({product:i.product,unit:i.unit,qty:Number(i.qty),price:Number(i.price)}))
    }));
  }catch(e){state.orders=[];showToast('โหลดข้อมูลไม่สำเร็จ',false);}
  state.ordersLoading=false;state.ordersLoaded=true;render();
}
async function loadProducts(){
  state.productsLoading=true;render();
  try{const r=await sbGet('products','select=*&order=id');state.products=Array.isArray(r)?r:[];}
  catch(e){state.products=[];}
  state.productsLoading=false;state.productsLoaded=true;render();
}

async function loadSets(){
  state.setsLoading=true;render();
  try{
    const sets=await sbGet('product_sets','select=*&order=created_at.asc');
    const items=await sbGet('product_set_items','select=*');
    state.sets=(Array.isArray(sets)?sets:[]).map(s=>({
      ...s,
      items:(Array.isArray(items)?items:[]).filter(i=>i.set_id===s.id)
    }));
  }catch(e){state.sets=[];}
  state.setsLoading=false;state.setsLoaded=true;render();
}

async function saveSet(setData, items){
  const isNew=!setData.id;
  const totalCalc=items.reduce((s,i)=>s+(Number(i.qty)*Number(i.price)),0);
  const payload={name:setData.name,description:setData.description||'',total_price:totalCalc};
  let setId=setData.id;

  if(isNew){
    // ใช้ Prefer: return=representation เพื่อรับ id กลับมา
    const r=await fetch(`${SB_URL}/rest/v1/product_sets`,{
      method:'POST',
      headers:{...SB_H,'Prefer':'return=representation'},
      body:JSON.stringify(payload)
    });
    if(!r.ok){
      const err=await r.text();
      throw new Error('saveSet failed: '+err);
    }
    const d=await r.json();
    // Supabase คืนเป็น array เสมอเมื่อใช้ return=representation
    setId=Array.isArray(d)?d[0]?.id:d?.id;
    if(!setId)throw new Error('ไม่ได้รับ id จาก Supabase — ตรวจสอบ RLS policy ของ product_sets');
  } else {
    const r=await fetch(`${SB_URL}/rest/v1/product_sets?id=eq.${setData.id}`,{
      method:'PATCH',
      headers:{...SB_H,'Prefer':'return=minimal'},
      body:JSON.stringify(payload)
    });
    if(!r.ok){const err=await r.text();throw new Error('patchSet failed: '+err);}
  }

  // ลบ items เดิม
  const rd=await fetch(`${SB_URL}/rest/v1/product_set_items?set_id=eq.${setId}`,{method:'DELETE',headers:SB_H});
  if(!rd.ok){const err=await rd.text();throw new Error('deleteItems failed: '+err);}

  // เพิ่ม items ใหม่
  if(items.length>0){
    const ri=await fetch(`${SB_URL}/rest/v1/product_set_items`,{
      method:'POST',
      headers:{...SB_H,'Prefer':'return=minimal'},
      body:JSON.stringify(items.map(i=>({set_id:setId,product:i.product,unit:i.unit||'',qty:Number(i.qty)||1,price:Number(i.price)||0})))
    });
    if(!ri.ok){const err=await ri.text();throw new Error('insertItems failed: '+err);}
  }

  return setId;
}

async function deleteSet(setId){
  await sbDelete('product_set_items',`set_id=eq.${setId}`);
  await sbDelete('product_sets',`id=eq.${setId}`);
}

    if(el)el.scrollTop=scrollTop;
  }));

  // qty ใน set เปลี่ยน → อัปเดต total live
  document.querySelectorAll('[data-setqty]').forEach(inp=>inp.addEventListener('input',()=>{
    _syncSetItemsFromDom();
    const totalCalc=state.setModal.set.items.reduce((s,i)=>s+(Number(i.qty)*Number(i.price)),0);
    const priceEl=document.getElementById('set_price');
    if(priceEl)priceEl.value=totalCalc;
    // อัปเดต header ราคารวมโดยไม่ render ทั้งหมด
    const colTitle=document.querySelector('.set-builder-col-title:last-of-type');
    if(colTitle)colTitle.innerHTML=`รายการในเซ็ต (${state.setModal.set.items.length} รายการ — รวม <strong style="color:var(--y5)">${numFmt(totalCalc)}</strong> บาท)`;
    // อัปเดตราคารวมแต่ละแถว
    state.setModal.set.items.forEach((it,idx)=>{
      const rowTotalEls=document.querySelectorAll('[data-setqty]');
      if(rowTotalEls[idx]){
        const qty=Number(rowTotalEls[idx].value)||1;
        const rowEl=rowTotalEls[idx].closest('div');
        if(rowEl){
          const spans=rowEl.querySelectorAll('span');
          spans.forEach(sp=>{if(sp.style.textAlign==='right'&&sp.style.fontWeight==='600')sp.textContent=numFmt(qty*Number(it.price));});
        }
      }
    });
  }));

  // บันทึกเซ็ต
  document.getElementById('saveSetModal')?.addEventListener('click',async()=>{
    if(!state.setModal)return;
    _syncSetItemsFromDom();
    const name=document.getElementById('set_name')?.value?.trim();
    if(!name){showToast('กรุณาใส่ชื่อเซ็ต',false);return;}
    const desc=document.getElementById('set_desc')?.value||'';
    const items=state.setModal.set.items;
    if(!items.length){showToast('กรุณาเพิ่มสินค้าอย่างน้อย 1 รายการ',false);return;}
    state.saving=true;render();
    try{
      const setId=await saveSet({id:state.setModal.set.id||null,name,description:desc},items);
      await loadSets();
      state.setModal=null;state.saving=false;
      showToast('บันทึกเซ็ตสำเร็จ ✓');
    }catch(e){state.saving=false;render();console.error('saveSet error:',e);showToast('❌ '+e.message,false);}
  });

  // แก้ไขเซ็ต
  document.querySelectorAll('[data-editset]').forEach(btn=>btn.addEventListener('click',()=>{
    const s=state.sets.find(x=>x.id===btn.dataset.editset);
    if(s){
      if(!state.productsLoaded)loadProducts();
      state.setModal={mode:'edit',set:JSON.parse(JSON.stringify(s))};
      state.setProductSearch='';render();
    }
  }));

  // ลบเซ็ต
  document.querySelectorAll('[data-delset]').forEach(btn=>btn.addEventListener('click',()=>{
    state.setDelConfirm=btn.dataset.delset;render();
  }));
  document.getElementById('cancelDelSet')?.addEventListener('click',()=>{state.setDelConfirm=null;render();});
  document.getElementById('setDelBg')?.addEventListener('click',e=>{if(e.target.id==='setDelBg'){state.setDelConfirm=null;render();}});
  document.getElementById('confirmDelSet')?.addEventListener('click',async()=>{
    if(!state.setDelConfirm)return;
    state.saving=true;render();
    try{
      await deleteSet(state.setDelConfirm);
      state.sets=state.sets.filter(s=>s.id!==state.setDelConfirm);
      state.setDelConfirm=null;state.saving=false;render();
      showToast('ลบเซ็ตสำเร็จ ✓');
    }catch(e){state.saving=false;render();showToast('เชื่อมต่อ Supabase ไม่ได้',false);}
  });
}

function _syncSetItemsFromDom(){
  if(!state.setModal)return;
  document.querySelectorAll('[data-setqty]').forEach(inp=>{
    const idx=Number(inp.dataset.setqty);
    if(state.setModal.set.items[idx]!==undefined){
      state.setModal.set.items[idx].qty=Math.max(1,Number(inp.value)||1);
    }
  });
}

render();
if(state.page==='main')loadOrders();
</script>
